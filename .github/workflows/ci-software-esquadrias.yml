name: Software Esquadrias CI

on:
  push:
    branches: [feature/maxim-ar-engine-v3, feature/gr-engine-v1]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full 40-character commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          persist-credentials: false

      - name: Record clean runner identity
        id: identity
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          set -euo pipefail
          tested_sha="$(git rev-parse HEAD)"
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || [[ "${tested_sha,,}" != "${TARGET_SHA,,}" ]]; then
            echo "Checkout mismatch: expected $TARGET_SHA, got $tested_sha" >&2
            exit 1
          fi
          echo "tested_sha=$tested_sha" >> "$GITHUB_OUTPUT"
          {
            echo "target_sha=$tested_sha"
            echo "utc_started=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "runner=${RUNNER_OS} ${RUNNER_ARCH} / ubuntu-24.04"
            echo "github_run_id=${GITHUB_RUN_ID}"
          } > software-esquadrias-ci-evidence.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install actual Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r api/requirements.txt

      - name: Engine suite
        shell: bash
        run: |
          set -euo pipefail
          command='python -m unittest discover -s "engine/Software_Esquadrias_Starter + Versões/Software_Esquadrias_Starter_v0.3.1_GUI/Software_Esquadrias_Starter_v0.3.1_GUI/tests"'
          echo "python=$(python --version 2>&1)" >> software-esquadrias-ci-evidence.txt
          echo "engine_command=$command" >> software-esquadrias-ci-evidence.txt
          set +e
          python -m unittest discover -s "engine/Software_Esquadrias_Starter + Versões/Software_Esquadrias_Starter_v0.3.1_GUI/Software_Esquadrias_Starter_v0.3.1_GUI/tests" > engine-ci.log 2>&1
          code=$?
          set -e
          cat engine-ci.log
          echo "engine_exit_code=$code" >> software-esquadrias-ci-evidence.txt
          if grep -E '^Ran [0-9]+ tests|^OK$|^FAILED' engine-ci.log >> software-esquadrias-ci-evidence.txt; then :; fi
          exit "$code"

      - name: API suite
        shell: bash
        run: |
          set -euo pipefail
          echo 'api_command=python -m unittest discover -s api/tests' >> software-esquadrias-ci-evidence.txt
          set +e
          python -m unittest discover -s api/tests > api-ci.log 2>&1
          code=$?
          set -e
          cat api-ci.log
          echo "api_exit_code=$code" >> software-esquadrias-ci-evidence.txt
          if grep -E '^Ran [0-9]+ tests|^OK$|^FAILED' api-ci.log >> software-esquadrias-ci-evidence.txt; then :; fi
          exit "$code"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Web dependencies
        working-directory: web
        run: npm ci

      - name: Web production build
        shell: bash
        run: |
          set -euo pipefail
          echo "node=$(node --version)" >> software-esquadrias-ci-evidence.txt
          echo "npm=$(npm --version)" >> software-esquadrias-ci-evidence.txt
          echo 'web_command=npm run build (working-directory: web)' >> software-esquadrias-ci-evidence.txt
          set +e
          (cd web && npm run build) > web-ci.log 2>&1
          code=$?
          set -e
          cat web-ci.log
          echo "web_exit_code=$code" >> software-esquadrias-ci-evidence.txt
          exit "$code"

      - name: Publish evidence summary
        if: always()
        shell: bash
        run: |
          echo "utc_finished=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> software-esquadrias-ci-evidence.txt
          echo "job_status=${{ job.status }}" >> software-esquadrias-ci-evidence.txt
          {
            echo '## Software Esquadrias — independent CI evidence'
            echo
            echo '| Field | Result |'
            echo '| --- | --- |'
            while IFS='=' read -r key value; do
              echo "| $key | $value |"
            done < software-esquadrias-ci-evidence.txt
            echo
            echo 'The tested SHA was verified against the checkout HEAD on a GitHub-hosted ubuntu-24.04 runner.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: software-esquadrias-ci-evidence
          path: |
            software-esquadrias-ci-evidence.txt
            engine-ci.log
            api-ci.log
            web-ci.log
          if-no-files-found: error
